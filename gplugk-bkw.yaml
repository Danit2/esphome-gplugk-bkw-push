    lambda: |-
      return ${main_fuse_a};
    update_interval: never

  - platform: template
    id: fuse_utilization
    name: "Hauptsicherung Auslastung"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      if (id(last_data_ms) == 0 || uint32_t(millis() - id(last_data_ms)) >= ${stale_after_ms}) return NAN;
      const float fuse = ${main_fuse_a};
      if (fuse <= 0 || isnan(id(current_max).state)) return NAN;
      return id(current_max).state / fuse * 100.0f;
    web_server:
      sorting_group_id: group_calculated

  - platform: template
    id: current_headroom
    name: "Stromreserve schwaechste Phase"
    unit_of_measurement: "A"
    device_class: current
