  # --- Berechnete Werte -----------------------------------------------------
  # Bezug ist positiv, Ruecklieferung negativ. Die Berechnungen verwenden
  # ausschliesslich die oben empfangenen und bereits skalierten Zaehlerwerte.
  - platform: template
    id: net_power
    name: "Netzleistung saldiert"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (id(last_data_ms) == 0 || uint32_t(millis() - id(last_data_ms)) >= ${stale_after_ms}) return NAN;
      if (isnan(id(power_import_total).state) || isnan(id(power_export_total).state)) return NAN;
      return id(power_import_total).state - id(power_export_total).state;
    web_server:
      sorting_group_id: group_calculated

  - platform: template
    id: net_import_power
    name: "Bezug saldiert"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (id(last_data_ms) == 0 || uint32_t(millis() - id(last_data_ms)) >= ${stale_after_ms}) return NAN;
      if (isnan(id(power_import_total).state) || isnan(id(power_export_total).state)) return NAN;
      const float net = id(power_import_total).state - id(power_export_total).state;
      return std::max(net, 0.0f);
    web_server:
      sorting_group_id: group_calculated

  - platform: template
    id: net_export_power
    name: "Ruecklieferung saldiert"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (id(last_data_ms) == 0 || uint32_t(millis() - id(last_data_ms)) >= ${stale_after_ms}) return NAN;
      if (isnan(id(power_import_total).state) || isnan(id(power_export_total).state)) return NAN;
      const float net = id(power_import_total).state - id(power_export_total).state;
      return std::max(-net, 0.0f);
    web_server:
      sorting_group_id: group_calculated

  - platform: template
    id: net_power_l1
    name: "Netzleistung L1"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (id(last_data_ms) == 0 || uint32_t(millis() - id(last_data_ms)) >= ${stale_after_ms}) return NAN;
      if (isnan(id(power_import_l1).state) || isnan(id(power_export_l1).state)) return NAN;
      return id(power_import_l1).state - id(power_export_l1).state;
    web_server:
      sorting_group_id: group_calculated

  - platform: template
