    obis_code: "1.1.31.7.0.255"
    id: current_l1
    name: "Strom L1"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_phase

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.51.7.0.255"
    id: current_l2
    name: "Strom L2"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_phase

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.71.7.0.255"
    id: current_l3
    name: "Strom L3"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_phase

  # --- Wirkleistung je Phase ----------------------------------------------
  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.21.7.0.255"
    id: power_import_l1
    name: "Leistung Bezug L1"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_phase

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.41.7.0.255"
    id: power_import_l2
    name: "Leistung Bezug L2"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_phase

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.61.7.0.255"
    id: power_import_l3
    name: "Leistung Bezug L3"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_phase

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.22.7.0.255"
    id: power_export_l1
    name: "Leistung Ruecklieferung L1"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_phase

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.42.7.0.255"
    id: power_export_l2
    name: "Leistung Ruecklieferung L2"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_phase

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.62.7.0.255"
    id: power_export_l3
    name: "Leistung Ruecklieferung L3"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_phase

  # --- Leistungsfaktoren ---------------------------------------------------
  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.33.7.0.255"
    name: "Leistungsfaktor L1"
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_phase

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.53.7.0.255"
    name: "Leistungsfaktor L2"
    state_class: measurement
    accuracy_decimals: 2
    filters:
