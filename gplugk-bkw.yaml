        sorting_group_id: group_diagnostics
    mac_address:
      name: "WLAN MAC-Adresse"
      entity_category: diagnostic
      web_server:
        sorting_group_id: group_diagnostics

  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    hide_hash: true
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics

  - platform: debug
    reset_reason:
      name: "Letzter Neustartgrund"
      entity_category: diagnostic
      web_server:
        sorting_group_id: group_diagnostics

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.0.2.129.255"
    name: "OBIS Listenkennung"
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_info

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "0.1.1.0.0.255"
    name: "Zaehler Uhr"
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_info

  - platform: template
    name: "Hoechstbelastete Phase"
    id: busiest_phase
    entity_category: diagnostic
    update_interval: 10s
    lambda: |-
      if (isnan(id(current_l1).state) || isnan(id(current_l2).state) || isnan(id(current_l3).state)) return {"unbekannt"};
      if (id(current_l1).state >= id(current_l2).state && id(current_l1).state >= id(current_l3).state) return {"L1"};
      if (id(current_l2).state >= id(current_l3).state) return {"L2"};
      return {"L3"};
    web_server:
      sorting_group_id: group_calculated

  - platform: template
    name: "Datenstatus"
    id: data_status
    entity_category: diagnostic
    update_interval: 5s
    lambda: |-
      if (id(last_data_ms) == 0) return {"Warte auf Zaehlerdaten"};
      if (uint32_t(millis() - id(last_data_ms)) >= ${stale_after_ms}) return {"Daten veraltet"};
      return {"OK"};
    web_server:
      sorting_group_id: group_diagnostics

binary_sensor:
  - platform: status
    name: "ESPHome Verbindung"
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics

  # Physischer AP-Taster auf GPIO9 mit internem Pull-up. GPIO9 ist beim
  # ESP32-C3 zugleich ein Boot-Strap-Pin.
  - platform: gpio
    id: ap_mode_button
    name: "AP-Taste"
    entity_category: diagnostic
    pin:
      number: ${ap_button_pin}
      mode:
        input: true
        pullup: true
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      then:
        - script.execute: enable_setup_ap
    web_server:
      sorting_group_id: group_diagnostics

  - platform: template
    name: "Zaehlerdaten aktuell"
    id: data_fresh
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(last_data_ms) != 0 && uint32_t(millis() - id(last_data_ms)) < ${stale_after_ms};
    on_release:
      then:
        # Diese Werte werden sonst nur bei einem neuen Telegramm publiziert.
        # Beim Veralten einmal gezielt auf unbekannt/0 setzen, statt jede
        # Sekunde unveraenderte Diagnosewerte ueber WLAN zu senden.
        - lambda: |-
            id(mean_import_15min).publish_state(NAN);
            id(mean_export_15min).publish_state(NAN);
            id(window_coverage_sensor).publish_state(0.0f);
    web_server:
      sorting_group_id: group_diagnostics

  - platform: template
    name: "Phasenstrom ueber Sicherungsnennwert"
    id: fuse_threshold_exceeded
    device_class: problem
    lambda: |-
      const float fuse = ${main_fuse_a};
      if (fuse <= 0 || id(last_data_ms) == 0 || uint32_t(millis() - id(last_data_ms)) >= ${stale_after_ms}) return false;
      if (isnan(id(current_max).state)) return false;
      return id(current_max).state > fuse;
    web_server:
      sorting_group_id: group_diagnostics

  - platform: template
    name: "Gleichzeitige Leistungsrichtungen"
    id: simultaneous_directions
    device_class: problem
    lambda: |-
      if (id(last_data_ms) == 0 || uint32_t(millis() - id(last_data_ms)) >= ${stale_after_ms}) return false;
      if (isnan(id(simultaneous_import_export).state)) return false;
      return id(simultaneous_import_export).state > 0.0f;
    web_server:
      sorting_group_id: group_diagnostics


# Software-Gegenstueck zum physischen Reset-Taster. Der Hardware-Reset wirkt
# direkt auf den ESP32-C3 und benoetigt deshalb keinen ESPHome-GPIO-Eintrag.
button:
  - platform: restart
    name: "Software Neustart"
    entity_category: config
    web_server:
      sorting_group_id: group_diagnostics
