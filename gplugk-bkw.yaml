      if (isnan(id(power_import_total).state) || isnan(id(power_export_total).state)) return NAN;
      return std::min(id(power_import_total).state, id(power_export_total).state);
    web_server:
      sorting_group_id: group_calculated

  - platform: template
    id: current_sum
    name: "Stromsumme L1 L2 L3"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      if (id(last_data_ms) == 0 || uint32_t(millis() - id(last_data_ms)) >= ${stale_after_ms}) return NAN;
      if (isnan(id(current_l1).state) || isnan(id(current_l2).state) || isnan(id(current_l3).state)) return NAN;
      return id(current_l1).state + id(current_l2).state + id(current_l3).state;
    web_server:
      sorting_group_id: group_calculated

  - platform: template
    id: current_spread
    name: "Phasenstrom Spreizung"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 10s
    lambda: |-
      if (id(last_data_ms) == 0 || uint32_t(millis() - id(last_data_ms)) >= ${stale_after_ms}) return NAN;
      if (isnan(id(current_l1).state) || isnan(id(current_l2).state) || isnan(id(current_l3).state)) return NAN;
      const float maximum = std::max(id(current_l1).state, std::max(id(current_l2).state, id(current_l3).state));
      const float minimum = std::min(id(current_l1).state, std::min(id(current_l2).state, id(current_l3).state));
      return maximum - minimum;
    web_server:
      sorting_group_id: group_calculated

  - platform: template
    id: apparent_power_sum
    name: "Scheinleistung Summe U x I"
    unit_of_measurement: "VA"
    device_class: apparent_power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (id(last_data_ms) == 0 || uint32_t(millis() - id(last_data_ms)) >= ${stale_after_ms}) return NAN;
      if (isnan(id(voltage_l1).state) || isnan(id(voltage_l2).state) || isnan(id(voltage_l3).state) ||
          isnan(id(current_l1).state) || isnan(id(current_l2).state) || isnan(id(current_l3).state)) return NAN;
      return id(voltage_l1).state * id(current_l1).state
           + id(voltage_l2).state * id(current_l2).state
           + id(voltage_l3).state * id(current_l3).state;
    web_server:
      sorting_group_id: group_calculated

