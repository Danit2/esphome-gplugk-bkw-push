      const float fuse = ${main_fuse_a};
      if (fuse <= 0 || isnan(id(current_max).state)) return NAN;
      return fuse - id(current_max).state;
    web_server:
      sorting_group_id: group_calculated

  - platform: template
    id: net_power_from_phases
    name: "Netzleistung aus Phasen"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (id(last_data_ms) == 0 || uint32_t(millis() - id(last_data_ms)) >= ${stale_after_ms}) return NAN;
      if (isnan(id(power_import_l1).state) || isnan(id(power_import_l2).state) || isnan(id(power_import_l3).state) ||
          isnan(id(power_export_l1).state) || isnan(id(power_export_l2).state) || isnan(id(power_export_l3).state)) return NAN;
      return id(power_import_l1).state + id(power_import_l2).state + id(power_import_l3).state
           - id(power_export_l1).state - id(power_export_l2).state - id(power_export_l3).state;
    web_server:
      sorting_group_id: group_calculated

  - platform: template
    id: balancing_difference
    name: "Saldierungsabweichung"
    unit_of_measurement: "W"
