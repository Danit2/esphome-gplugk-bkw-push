# SPDX-License-Identifier: MIT
# gPlugK / BKW Kamstrup OMNIPOWER KS2
# Reine ESPHome-Konfiguration ohne externe oder lokale Custom Components.

substitutions:
  device_name: gplugk-bkw
  friendly_name: gPlugK

  # gPlugK V3.11 - Hardware-Pinbelegung
  han_rx_pin: GPIO4
  led_red_pin: GPIO5
  led_green_pin: GPIO6
  led_blue_pin: GPIO7
  ap_button_pin: GPIO9

  # BKW-Ablesefaktor/Wandlerfaktor.
  # Bei einem normalen Direktmesszaehler auf 1.0 belassen.
  ct_factor: "1.0"

  # Hauptsicherung pro Phase in Ampere. 0 = unbekannt/deaktiviert.
  # Beispiel fuer 25-A-Hauptsicherungen: "25"
  main_fuse_a: "0"

  # Werte gelten nach dieser Zeit ohne neues Telegramm als veraltet.
  stale_after: "35s"
  stale_after_ms: "35000"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.8.2
  comment: BKW Kamstrup OMNIPOWER KS2 via native ESPHome DLMS
  on_boot:
    - priority: -100
      then:
        - script.execute: status_led_startup

esp32:
  board: esp32-c3-devkitm-1
  # ESP32-C3 darf bis 160 MHz laufen. Mit DFS taktet ESP-IDF im Leerlauf
  # automatisch bis auf die 40-MHz-XTAL-Frequenz herunter. So bleibt fuer
  # DLMS/API kurzzeitig volle Leistung verfuegbar, ohne dauerhaft 160 MHz zu nutzen.
  cpu_frequency: 160MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      # Espressif-Empfehlung fuer WiFi-Geraete: Min Modem-sleep + DFS.
      # Auto-Light-Sleep wird absichtlich NICHT aktiviert, damit der asynchrone
      # 2400-Baud-DLMS-Empfang auf GPIO4 jederzeit sicher aktiv bleibt.
      CONFIG_PM_ENABLE: y
      CONFIG_PM_DFS_INIT_AUTO: y

logger:
  level: INFO
  baud_rate: 0

# Liefert zusaetzliche Systemdiagnosewerte wie freien Heap und Reset-Grund.
debug:
  update_interval: 60s

wifi:
  id: gplugk_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: light
  # Stationaeres Geraet: keine periodischen Roaming-Scans. Das spart WLAN-
  # Aktivitaet und vermeidet unnoetige Lastspitzen im knappen Leistungsbudget.
  post_connect_roaming: false
  reboot_timeout: 0s
  on_connect:
    - lambda: id(gplugk_wifi).set_ap_timeout(0);
  ap:
    ssid: "${device_name} Setup"
    password: !secret fallback_password
    # Kein automatischer Fallback-AP: SoftAP-Betrieb benoetigt deutlich mehr
    # WLAN-Aktivitaet. Der physische AP-Taster auf GPIO9 aktiviert ihn bei Bedarf.
    ap_timeout: 0s

captive_portal:

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s
  # Die vielen Werte eines DLMS-Telegramms werden moeglichst gemeinsam gesendet.
  # 500 ms sind gegenueber dem ca. 10-s-Zaehlerintervall praktisch nicht bemerkbar,
  # reduzieren aber unnoetige einzelne WLAN-Pakete.
  batch_delay: 500ms

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server

web_server:
  port: 80
  version: 3
  local: true
  include_internal: false
  log: false
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password
  sorting_groups:
    - id: group_grid
      name: Netzanschluss
      sorting_weight: 10
    - id: group_phase
      name: Phasen
      sorting_weight: 20
    - id: group_energy
      name: Zaehlerstaende
      sorting_weight: 30
    - id: group_calculated
      name: Berechnete Werte
      sorting_weight: 40
    - id: group_info
      name: Zaehlerinformationen
      sorting_weight: 50
    - id: group_diagnostics
      name: Diagnose
      sorting_weight: 60

uart:
  id: meter_uart
  rx_pin: ${han_rx_pin}
  baud_rate: 2400
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 4096

# ESPHome-eigene DLMS-Unterstuetzung.
dlms_meter:
  id: bkw_meter
  uart_id: meter_uart
  receive_timeout: 1500ms
  decryption_key: !secret bkw_gpk60
  # Falls BKW zusaetzlich einen GPK61/Auth-Key bereitstellt, die folgende
  # Zeile aktivieren und bkw_gpk61 in secrets.yaml eintragen:
  # auth_key: !secret bkw_gpk61
  skip_crc: false
  custom_patterns:
    # Die Listenkennung steht beim BKW/Kamstrup-Telegramm am Anfang ohne
    # eigenen OBIS-Tag. Das native dlms_meter ordnet sie so korrekt zu.
    - pattern: "F, TSTR"
      name: "BKW list identifier"
      priority: 0
      default_obis: "1.1.0.2.129.255"

# Laufzeitstatus fuer Diagnosewerte. Keine Flash-Schreibvorgaenge.
globals:
  - id: last_data_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: last_interval_s_value
    type: float
    restore_value: no
    initial_value: 'NAN'

  - id: received_sets_count
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: mean_import_15min_value
    type: float
    restore_value: no
    initial_value: 'NAN'

  - id: mean_export_15min_value
    type: float
    restore_value: no
    initial_value: 'NAN'

  - id: window_coverage_s_value
    type: float
    restore_value: no
    initial_value: '0.0'

  # Status-LED-Laufzeitwerte. Keine Speicherung im Flash.
  - id: led_startup_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: green_flash_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

# Die RGB-LED der V3.11 besitzt drei getrennte aktive High-Ausgaenge:
# Rot=GPIO5, Gruen=GPIO6, Blau=GPIO7.
output:
  - platform: gpio
    id: status_led_red
    pin:
      number: ${led_red_pin}
      inverted: false

  - platform: gpio
    id: status_led_green
    pin:
      number: ${led_green_pin}
      inverted: false

  - platform: gpio
    id: status_led_blue
    pin:
      number: ${led_blue_pin}
      inverted: false

script:
  # Startanzeige: einmal Rot -> Gruen -> Blau.
  - id: status_led_startup
    mode: restart
    then:
      - lambda: id(led_startup_active) = true;
      - output.turn_off: status_led_red
      - output.turn_off: status_led_green
      - output.turn_off: status_led_blue
      - output.turn_on: status_led_red
      - delay: 500ms
      - output.turn_off: status_led_red
      - output.turn_on: status_led_green
      - delay: 500ms
      - output.turn_off: status_led_green
      - output.turn_on: status_led_blue
      - delay: 500ms
      - output.turn_off: status_led_blue
      - lambda: id(led_startup_active) = false;

  # Kurzer Gruen-Impuls bei einem empfangenen Zaehlertelegramm.
  - id: blink_data_led
    mode: restart
    then:
      - lambda: id(green_flash_until_ms) = millis() + 300;

  # Der AP-Taster ist als Wiederherstellungs-/Setup-Taster gedacht.
  # Da ESPHome keinen eigenen "AP jetzt starten"-Action anbietet, wird
  # der bereits konfigurierte Fallback-AP durch ein sehr kurzes Timeout
  # freigegeben. Das funktioniert insbesondere dann, wenn kein WLAN besteht.
  - id: enable_setup_ap
    mode: restart
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - logger.log:
                level: INFO
                format: "AP-Taste: WLAN ist bereits verbunden. WLAN-Aenderungen per ESPHome/OTA vornehmen."
          else:
            - logger.log:
                level: INFO
                format: "AP-Taste: Setup-Access-Point wird aktiviert."
            - lambda: id(gplugk_wifi).set_ap_timeout(1);

  # Wird einmal pro vollstaendig bis zum letzten numerischen OBIS-Wert
  # gelaufenem Telegramm aufgerufen. Hier entstehen die Laufzeitstatistiken
  # und das zeitgewichtete 15-Minuten-Fenster - komplett in YAML/Lambdas.
  - id: process_meter_update
    mode: queued
    max_runs: 2
    then:
      - lambda: |-
          const uint32_t now = millis();
          constexpr uint32_t PERIOD_MS = 900000;
          constexpr size_t WINDOW_SIZE = 192;

          static bool have_previous = false;
          static uint32_t previous_ms = 0;
          static float previous_import = 0.0f;
          static float previous_export = 0.0f;
          static uint32_t end_ms[WINDOW_SIZE] = {};
          static uint32_t duration_ms[WINDOW_SIZE] = {};
          static float imported_w[WINDOW_SIZE] = {};
          static float exported_w[WINDOW_SIZE] = {};
          static size_t head = 0;
          static size_t count = 0;
          static float peak_import = 0.0f;
          static float peak_export = 0.0f;
          static float peak_mean_import = NAN;

          auto clear_window = [&]() {
            head = 0;
            count = 0;
          };
          auto at = [&](size_t i) -> size_t {
            return (head + i) % WINDOW_SIZE;
          };
          auto overlap = [&](size_t idx) -> uint32_t {
            const uint32_t age = now - end_ms[idx];
            if (age >= PERIOD_MS) return 0;
            return std::min(duration_ms[idx], PERIOD_MS - age);
          };

          float import_now = NAN;
          float export_now = NAN;
          if (!isnan(id(power_import_total).state) && !isnan(id(power_export_total).state)) {
            const float net = id(power_import_total).state - id(power_export_total).state;
            import_now = std::max(net, 0.0f);
            export_now = std::max(-net, 0.0f);
          }

          if (have_previous) {
            const uint32_t elapsed = now - previous_ms;
            id(last_interval_s_value) = elapsed / 1000.0f;

            if (elapsed > 0 && elapsed < ${stale_after_ms}) {
              while (count > 0 && uint32_t(now - end_ms[at(0)]) >= PERIOD_MS) {
                head = (head + 1) % WINDOW_SIZE;
                count--;
              }
              if (count == WINDOW_SIZE) clear_window();

              const size_t idx = at(count);
              end_ms[idx] = now;
              duration_ms[idx] = elapsed;
              imported_w[idx] = previous_import;
              exported_w[idx] = previous_export;
              count++;
            } else {
              clear_window();
            }
          } else {
            id(last_interval_s_value) = NAN;
          }

          double coverage_ms = 0.0;
          double import_integral = 0.0;
          double export_integral = 0.0;
          for (size_t i = 0; i < count; i++) {
            const size_t idx = at(i);
            const uint32_t part = overlap(idx);
            coverage_ms += part;
            import_integral += double(part) * imported_w[idx];
            export_integral += double(part) * exported_w[idx];
          }

          float mean_import = NAN;
          float mean_export = NAN;
          if (coverage_ms >= PERIOD_MS) {
            mean_import = import_integral / coverage_ms;
            mean_export = export_integral / coverage_ms;
          }

          if (!isnan(import_now)) {
            peak_import = std::max(peak_import, import_now);
            peak_export = std::max(peak_export, export_now);
            if (!isnan(mean_import)) {
              peak_mean_import = isnan(peak_mean_import) ? mean_import : std::max(peak_mean_import, mean_import);
            }
          }

          id(last_data_ms) = now;
          id(received_sets_count) += 1;
          id(mean_import_15min_value) = mean_import;
          id(mean_export_15min_value) = mean_export;
          id(window_coverage_s_value) = coverage_ms / 1000.0f;

          id(peak_import_sensor).publish_state(peak_import);
          id(peak_export_sensor).publish_state(peak_export);
          id(peak_mean_import_15min).publish_state(peak_mean_import);
          id(received_sets_sensor).publish_state(id(received_sets_count));
          id(last_interval_sensor).publish_state(id(last_interval_s_value));
          id(mean_import_15min).publish_state(mean_import);
          id(mean_export_15min).publish_state(mean_export);
          id(window_coverage_sensor).publish_state(id(window_coverage_s_value));

          have_previous = !isnan(import_now);
          previous_ms = now;
          previous_import = isnan(import_now) ? 0.0f : import_now;
          previous_export = isnan(export_now) ? 0.0f : export_now;

# RGB-Statuslogik. Prioritaet: Startsequenz > WLAN-Fehler > keine Daten > Datenimpuls.
# Rot blinkt ca. alle 9 s ohne WLAN, Blau ca. alle 15 s ohne Zaehlerdaten,
# Gruen flackert kurz bei jedem empfangenen Telegramm.
interval:
  - interval: 250ms
    then:
      - lambda: |-
          if (id(led_startup_active)) return;

          const uint32_t now = millis();
          id(status_led_red).turn_off();
          id(status_led_green).turn_off();
          id(status_led_blue).turn_off();

          if (!id(gplugk_wifi).is_connected()) {
            if ((now % 9000U) < 250U) id(status_led_red).turn_on();
            return;
          }

          const bool data_stale = id(last_data_ms) == 0 ||
              uint32_t(now - id(last_data_ms)) >= ${stale_after_ms};
          if (data_stale) {
            if ((now % 15000U) < 250U) id(status_led_blue).turn_on();
            return;
          }

          if (int32_t(id(green_flash_until_ms) - now) > 0) {
            id(status_led_green).turn_on();
          }

sensor:
  # --- Gesamtwerte ---------------------------------------------------------
  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.1.8.0.255"
    id: energy_import_total
    name: "Energie Bezug Gesamt"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    on_raw_value:
      then:
        - script.execute: blink_data_led
    web_server:
      sorting_group_id: group_energy

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.2.8.0.255"
    id: energy_export_total
    name: "Energie Ruecklieferung Gesamt"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_energy

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.3.8.0.255"
    name: "Blindenergie Plus Gesamt"
    unit_of_measurement: "kvarh"
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_energy

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.4.8.0.255"
    name: "Blindenergie Minus Gesamt"
    unit_of_measurement: "kvarh"
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_energy

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.1.7.0.255"
    id: power_import_total
    name: "Leistung Bezug Gesamt"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_grid

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.2.7.0.255"
    id: power_export_total
    name: "Leistung Ruecklieferung Gesamt"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_grid

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.3.7.0.255"
    name: "Blindleistung Plus Gesamt"
    unit_of_measurement: "var"
    device_class: reactive_power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_grid

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.4.7.0.255"
    name: "Blindleistung Minus Gesamt"
    unit_of_measurement: "var"
    device_class: reactive_power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_grid

  # --- Spannungen und Stroeme ---------------------------------------------
  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.32.7.0.255"
    id: voltage_l1
    name: "Spannung L1"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_phase

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.52.7.0.255"
    id: voltage_l2
    name: "Spannung L2"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_phase

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.72.7.0.255"
    id: voltage_l3
    name: "Spannung L3"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
