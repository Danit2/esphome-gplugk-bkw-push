# SPDX-License-Identifier: MIT
# gPlugK / BKW Kamstrup OMNIPOWER KS2
# Reine ESPHome-Konfiguration ohne externe oder lokale Custom Components.

substitutions:
  device_name: gplugk-bkw
  friendly_name: gPlugK

  # gPlugK V3.11 - Hardware-Pinbelegung
  han_rx_pin: GPIO4
  led_red_pin: GPIO5
  led_green_pin: GPIO6
  led_blue_pin: GPIO7
  ap_button_pin: GPIO9

  # BKW-Ablesefaktor/Wandlerfaktor.
  # Bei einem normalen Direktmesszähler auf 1.0 belassen.
  ct_factor: "1.0"

  # Hauptsicherung pro Phase in Ampere. 0 = unbekannt/deaktiviert.
  # Beispiel für 25-A-Hauptsicherungen: "25"
  main_fuse_a: "0"

  # Werte gelten nach dieser Zeit ohne neues Telegramm als veraltet.
  stale_after: "35s"
  stale_after_ms: "35000"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.9.0
  comment: BKW Kamstrup OMNIPOWER KS2 via native ESPHome DLMS
  on_boot:
    - priority: -100
      then:
        - sensor.template.publish:
            id: main_fuse_sensor
            state: !lambda |-
              const float fuse = ${main_fuse_a};
              return fuse > 0.0f ? fuse : NAN;
        - script.execute: status_led_startup

esp32:
  board: esp32-c3-devkitm-1
  # ESP32-C3 darf bis 160 MHz laufen. Mit DFS taktet ESP-IDF im Leerlauf
  # automatisch bis auf die 40-MHz-XTAL-Frequenz herunter. So bleibt für
  # DLMS/API kurzzeitig volle Leistung verfuegbar, ohne dauerhaft 160 MHz zu nutzen.
  cpu_frequency: 80MHz
  framework:
    type: esp-idf
    advanced: 
      flash_chip: generic
    sdkconfig_options:
      # Espressif-Empfehlung für WiFi-Geräte: Min Modem-sleep + DFS.
      # Auto-Light-Sleep wird absichtlich NICHT aktiviert, damit der asynchrone
      # 2400-Baud-DLMS-Empfang auf GPIO4 jederzeit sicher aktiv bleibt.
      CONFIG_PM_ENABLE: y
      CONFIG_PM_DFS_INIT_AUTO: y

logger:
  level: WARN
  baud_rate: 0

# Liefert zusätzliche Systemdiagnosewerte wie Laufzeit und Reset-Grund.
debug:
  update_interval: 90s

wifi:
  id: gplugk_wifi
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: LIGHT
  # Stationäres Gerät: keine periodischen Roaming-Scans. Das spart WLAN-
  # Aktivitaet und vermeidet unnötige Lastspitzen im knappen Leistungsbudget.
  post_connect_roaming: false
  reboot_timeout: 0s
  on_connect:
    - lambda: id(gplugk_wifi).set_ap_timeout(0);
  ap:
    ssid: "${device_name} Setup"
    password: !secret fallback_password
    # Kein automatischer Fallback-AP: SoftAP-Betrieb benötigt deutlich mehr
    # WLAN-Aktivitaet. Der physische AP-Taster auf GPIO9 aktiviert ihn bei Bedarf.
    ap_timeout: 0s

captive_portal:

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s
  # Die vielen Werte eines DLMS-Telegramms werden möglichst gemeinsam gesendet.
  # 500 ms sind gegenüber dem ca. 10-s-Zählerintervall praktisch nicht bemerkbar,
  # reduzieren aber unnötige einzelne WLAN-Pakete.
  batch_delay: 500ms

ota:
  - platform: esphome
    encryption:

web_server:
  port: 80
  version: 3
  local: true
  include_internal: false
  log: false
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password
  sorting_groups:
    - id: group_grid
      name: Netzanschluss
      sorting_weight: 10
    - id: group_phase
      name: Phasen
      sorting_weight: 20
    - id: group_energy
      name: Zählerstände
      sorting_weight: 30
    - id: group_calculated
      name: Berechnete Werte
      sorting_weight: 40
    - id: group_info
      name: Zählerinformationen
      sorting_weight: 50
    - id: group_diagnostics
      name: Diagnose
      sorting_weight: 60

uart:
  id: meter_uart
  rx_pin: ${han_rx_pin}
  baud_rate: 2400
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 4096
  clock_source: XTAL

# ESPHome-eigene DLMS-Unterstuetzung.
dlms_meter:
  id: bkw_meter
  uart_id: meter_uart
  receive_timeout: 100ms
  decryption_key: !secret bkw_encryption
  auth_key: !secret bkw_auth
  skip_crc: false
  custom_patterns:
    # Die Listenkennung steht beim BKW/Kamstrup-Telegramm am Anfang ohne
    # eigenen OBIS-Tag. Das native dlms_meter ordnet sie so korrekt zu.
    - pattern: "F, TSTR"
      name: "BKW list identifier"
      priority: 0
      default_obis: "1.1.0.2.129.255"

# Laufzeitstatus für Diagnosewerte. Keine Flash-Schreibvorgaenge.
globals:
  - id: last_data_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  # Pro Telegramm: 14 Messwerte und ein Abschluss-OBIS-Feld.
  # Die Listenkennung startet; alle 14 Werte plus Abschlussfeld loesen aus.
  # Kein Flash: nur RAM, beim Neustart automatisch zurückgesetzt.
  - id: meter_frame_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: meter_seen_mask
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: meter_frame_started_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: last_interval_s_value
    type: float
    restore_value: no
    initial_value: 'NAN'

  - id: received_sets_count
    type: uint32_t
    restore_value: no
    initial_value: '0'

  - id: mean_import_15min_value
    type: float
    restore_value: no
    initial_value: 'NAN'

  - id: mean_export_15min_value
    type: float
    restore_value: no
    initial_value: 'NAN'

  - id: window_coverage_s_value
    type: float
    restore_value: no
    initial_value: '0.0'

  # Status-LED-Laufzeitwerte. Keine Speicherung im Flash.
  - id: led_startup_active
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: green_flash_until_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

# Die RGB-LED der V3.11 besitzt drei getrennte aktive High-Ausgaenge:
# Rot=GPIO5, Gruen=GPIO6, Blau=GPIO7.
output:
  - platform: gpio
    id: status_led_red
    pin:
      number: ${led_red_pin}
      inverted: false

  - platform: gpio
    id: status_led_green
    pin:
      number: ${led_green_pin}
      inverted: false

  - platform: gpio
    id: status_led_blue
    pin:
      number: ${led_blue_pin}
      inverted: false

script:
  # Startanzeige: einmal Rot -> Gruen -> Blau.
  - id: status_led_startup
    mode: restart
    then:
      - lambda: id(led_startup_active) = true;
      - output.turn_off: status_led_red
      - output.turn_off: status_led_green
      - output.turn_off: status_led_blue
      - output.turn_on: status_led_red
      - delay: 500ms
      - output.turn_off: status_led_red
      - output.turn_on: status_led_green
      - delay: 500ms
      - output.turn_off: status_led_green
      - output.turn_on: status_led_blue
      - delay: 500ms
      - output.turn_off: status_led_blue
      - lambda: id(led_startup_active) = false;

  # Kurzer Gruen-Impuls bei einem empfangenen Zählertelegramm.
  - id: blink_data_led
    mode: restart
    then:
      - lambda: id(green_flash_until_ms) = millis() + 300;

  # Der AP-Taster ist als Wiederherstellungs-/Setup-Taster gedacht.
  # Da ESPHome keinen eigenen "AP jetzt starten"-Action anbietet, wird
  # der bereits konfigurierte Fallback-AP durch ein sehr kurzes Timeout
  # freigegeben. Das funktioniert insbesondere dann, wenn kein WLAN besteht.
  - id: enable_setup_ap
    mode: restart
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - logger.log:
                level: INFO
                format: "AP-Taster: WLAN ist bereits verbunden. WLAN-Änderungen per ESPHome/OTA vornehmen."
          else:
            - logger.log:
                level: INFO
                format: "AP-Taster: Setup-Access-Point wird aktiviert."
            - lambda: id(gplugk_wifi).set_ap_timeout(1);

  # Nur bei 14/14 Messwerten plus Abschlussfeld EINES Telegramms.
  # Hier entstehen die 15 Berechnungen, zugehörige Textstatus und die
  # zeitgewichteten 15-Minuten-Statistiken in EINEM Schnappschuss.
  - id: process_meter_update
    mode: queued
    max_runs: 2
    then:
      - lambda: |-
          const uint32_t now = millis();
          constexpr uint32_t PERIOD_MS = 900000;
          constexpr size_t WINDOW_SIZE = 192;

          // Diese Werte sind bereits durch die Bitmaske als neu empfangen
          // bestaetigt. Einmalig kopieren, danach nur mit diesem Schnappschuss
          // rechnen (keine Template-Zwischenwerte, keine 10-s-Timer).
          const float p_in = id(power_import_total).state;
          const float p_out = id(power_export_total).state;
          const float p_in1 = id(power_import_l1).state;
          const float p_out1 = id(power_export_l1).state;
          const float p_in2 = id(power_import_l2).state;
          const float p_out2 = id(power_export_l2).state;
          const float p_in3 = id(power_import_l3).state;
          const float p_out3 = id(power_export_l3).state;
          const float i1 = id(current_l1).state;
          const float i2 = id(current_l2).state;
          const float i3 = id(current_l3).state;
          const float u1 = id(voltage_l1).state;
          const float u2 = id(voltage_l2).state;
          const float u3 = id(voltage_l3).state;
          const float fuse = ${main_fuse_a};

          // Zusaetzliche Absicherung, falls ein Sensor unmittelbar nach dem
          // Trigger ungueltig geworden sein sollte (z. B. Timeout-Filter).
          const float values[] = {
            p_in, p_out, p_in1, p_out1, p_in2, p_out2,
            p_in3, p_out3, i1, i2, i3, u1, u2, u3
          };
          for (float v : values) {
            if (!std::isfinite(v)) {
              ESP_LOGW("bkw_calc", "Telegramm unvollstaendig: Sensorstatus ungueltig");
              return;
            }
          }

          const float p_net = p_in - p_out;
          const float p1 = p_in1 - p_out1;
          const float p2 = p_in2 - p_out2;
          const float p3 = p_in3 - p_out3;
          const float p_phases = p1 + p2 + p3;
          const float max_i = std::max(i1, std::max(i2, i3));
          const float min_i = std::min(i1, std::min(i2, i3));
          const bool fuse_ok = std::isfinite(fuse) && fuse > 0.0f;

          static bool have_previous = false;
          static uint32_t previous_ms = 0;
          static float previous_import = 0.0f;
          static float previous_export = 0.0f;
          static uint32_t end_ms[WINDOW_SIZE] = {};
          static uint32_t duration_ms[WINDOW_SIZE] = {};
          static float imported_w[WINDOW_SIZE] = {};
          static float exported_w[WINDOW_SIZE] = {};
          static size_t head = 0;
          static size_t count = 0;
          static float peak_import = 0.0f;
          static float peak_export = 0.0f;
          static float peak_mean_import = NAN;

          auto clear_window = [&]() {
            head = 0;
            count = 0;
          };
          auto at = [&](size_t i) -> size_t {
            return (head + i) % WINDOW_SIZE;
          };
          auto overlap = [&](size_t idx) -> uint32_t {
            const uint32_t age = now - end_ms[idx];
            if (age >= PERIOD_MS) return 0;
            return std::min(duration_ms[idx], PERIOD_MS - age);
          };

          const float import_now = std::max(p_net, 0.0f);
          const float export_now = std::max(-p_net, 0.0f);

          if (have_previous) {
            const uint32_t elapsed = now - previous_ms;
            id(last_interval_s_value) = elapsed / 1000.0f;

            if (elapsed > 0 && elapsed < ${stale_after_ms}) {
              while (count > 0 && uint32_t(now - end_ms[at(0)]) >= PERIOD_MS) {
                head = (head + 1) % WINDOW_SIZE;
                count--;
              }
              if (count == WINDOW_SIZE) clear_window();

              const size_t idx = at(count);
              end_ms[idx] = now;
              duration_ms[idx] = elapsed;
              imported_w[idx] = previous_import;
              exported_w[idx] = previous_export;
              count++;
            } else {
              clear_window();
            }
          } else {
            id(last_interval_s_value) = NAN;
          }

          double coverage_ms = 0.0;
          double import_integral = 0.0;
          double export_integral = 0.0;
          for (size_t i = 0; i < count; i++) {
            const size_t idx = at(i);
            const uint32_t part = overlap(idx);
            coverage_ms += part;
            import_integral += double(part) * imported_w[idx];
            export_integral += double(part) * exported_w[idx];
          }

          float mean_import = NAN;
          float mean_export = NAN;
          if (coverage_ms >= PERIOD_MS) {
            mean_import = import_integral / coverage_ms;
            mean_export = export_integral / coverage_ms;
          }

          if (!isnan(import_now)) {
            peak_import = std::max(peak_import, import_now);
            peak_export = std::max(peak_export, export_now);
            if (!isnan(mean_import)) {
              peak_mean_import = isnan(peak_mean_import) ? mean_import : std::max(peak_mean_import, mean_import);
            }
          }

          id(last_data_ms) = now;
          id(received_sets_count) += 1;
          id(mean_import_15min_value) = mean_import;
          id(mean_export_15min_value) = mean_export;
          id(window_coverage_s_value) = coverage_ms / 1000.0f;

          id(peak_import_sensor).publish_state(peak_import);
          id(peak_export_sensor).publish_state(peak_export);
          id(peak_mean_import_15min).publish_state(peak_mean_import);
          id(received_sets_sensor).publish_state(id(received_sets_count));
          id(last_interval_sensor).publish_state(id(last_interval_s_value));
          id(mean_import_15min).publish_state(mean_import);
          id(mean_export_15min).publish_state(mean_export);
          id(window_coverage_sensor).publish_state(id(window_coverage_s_value));

          have_previous = true;
          previous_ms = now;
          previous_import = import_now;
          previous_export = export_now;

          // Alle 15 berechneten Sensoren: derselbe gültige Datensatz.
          id(net_power).publish_state(p_net);
          id(net_import_power).publish_state(import_now);
          id(net_export_power).publish_state(export_now);
          id(net_power_l1).publish_state(p1);
          id(net_power_l2).publish_state(p2);
          id(net_power_l3).publish_state(p3);
          id(net_power_from_phases).publish_state(p_phases);
          id(balancing_difference).publish_state(p_net - p_phases);
          id(simultaneous_import_export).publish_state(std::min(p_in, p_out));
          id(current_max).publish_state(max_i);
          id(fuse_utilization).publish_state(fuse_ok ? 100.0f * max_i / fuse : NAN);
          id(current_headroom).publish_state(fuse_ok ? fuse - max_i : NAN);
          id(current_sum).publish_state(i1 + i2 + i3);
          id(current_spread).publish_state(max_i - min_i);
          id(apparent_power_sum).publish_state(u1 * i1 + u2 * i2 + u3 * i3);

          // Auch die vom Zähler abhängigen Textstatus direkt aus dem
          // Schnappschuss ableiten; nicht 10 Sekunden später aus anderen
          // berechneten Sensordaten auslesen.
          id(busiest_phase).publish_state(
              i1 >= i2 && i1 >= i3 ? "L1" : (i2 >= i3 ? "L2" : "L3"));
          id(fuse_threshold_status).publish_state(
              !fuse_ok ? "Nicht konfiguriert" :
              (max_i > fuse ? "Überschritten" : "Innerhalb Grenzwert"));
          id(simultaneous_directions_status).publish_state(
              std::min(p_in, p_out) > 0.0f ? "Erkannt" : "Nicht erkannt");

# RGB-Statuslogik. Prioritaet: Startsequenz > WLAN-Fehler > keine Daten > Datenimpuls.
# Rot blinkt ca. alle 9 s ohne WLAN, Blau ca. alle 15 s ohne Zählerdaten,
# Gruen flackert kurz bei jedem empfangenen Telegramm.
interval:
  - interval: 250ms
    then:
      - lambda: |-
          if (id(led_startup_active)) return;

          const uint32_t now = millis();
          id(status_led_red).turn_off();
          id(status_led_green).turn_off();
          id(status_led_blue).turn_off();

          if (!id(gplugk_wifi).is_connected()) {
            if ((now % 9000U) < 250U) id(status_led_red).turn_on();
            return;
          }

          const bool data_stale = id(last_data_ms) == 0 ||
              uint32_t(now - id(last_data_ms)) >= ${stale_after_ms};
          if (data_stale) {
            if ((now % 15000U) < 250U) id(status_led_blue).turn_on();
            return;
          }

          if (int32_t(id(green_flash_until_ms) - now) > 0) {
            id(status_led_green).turn_on();
          }

sensor:
  # --- Gesamtwerte ---------------------------------------------------------
  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.1.8.0.255"
    id: energy_import_total
    name: "Energie Bezug Gesamt"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    on_raw_value:
      then:
        - script.execute: blink_data_led
    web_server:
      sorting_group_id: group_energy

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.2.8.0.255"
    id: energy_export_total
    name: "Energie Rücklieferung Gesamt"
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_energy

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.3.8.0.255"
    name: "Blindenergie Plus Gesamt"
    unit_of_measurement: "kvarh"
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_energy

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.4.8.0.255"
    name: "Blindenergie Minus Gesamt"
    unit_of_measurement: "kvarh"
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_energy

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.1.7.0.255"
    id: power_import_total
    name: "Leistung Bezug Gesamt"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    # Bit 0: neuer, bereits skalierter Wert dieses Telegramms.
    on_value:
      then:
        - lambda: |-
            if (id(meter_frame_active) &&
                uint32_t(millis() - id(meter_frame_started_ms)) < 3000UL &&
                std::isfinite(x)) {
              id(meter_seen_mask) |= (1UL << 0);
              // 14 Messwerte + Abschlussfeld, nur einmal je Telegramm.
              if (id(meter_seen_mask) == 0x7FFFUL) {
                id(meter_frame_active) = false;
                id(process_meter_update).execute();
              }
            }
    web_server:
      sorting_group_id: group_grid

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.2.7.0.255"
    id: power_export_total
    name: "Leistung Rücklieferung Gesamt"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    # Bit 1: neuer, bereits skalierter Wert dieses Telegramms.
    on_value:
      then:
        - lambda: |-
            if (id(meter_frame_active) &&
                uint32_t(millis() - id(meter_frame_started_ms)) < 3000UL &&
                std::isfinite(x)) {
              id(meter_seen_mask) |= (1UL << 1);
              // 14 Messwerte + Abschlussfeld, nur einmal je Telegramm.
              if (id(meter_seen_mask) == 0x7FFFUL) {
                id(meter_frame_active) = false;
                id(process_meter_update).execute();
              }
            }
    web_server:
      sorting_group_id: group_grid

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.3.7.0.255"
    name: "Blindleistung Plus Gesamt"
    unit_of_measurement: "var"
    device_class: reactive_power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_grid

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.4.7.0.255"
    name: "Blindleistung Minus Gesamt"
    unit_of_measurement: "var"
    device_class: reactive_power
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - multiply: ${ct_factor}
      - timeout: ${stale_after}
    web_server:
      sorting_group_id: group_grid

  - platform: template
    name: "Hauptsicherung"
    id: main_fuse_sensor
    icon: "mdi:fuse"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    web_server:
      sorting_group_id: group_grid

  # --- Spannungen und Ströme ---------------------------------------------
  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.32.7.0.255"
    id: voltage_l1
    name: "Spannung L1"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - timeout: ${stale_after}
    # Bit 11: neuer, bereits skalierter Wert dieses Telegramms.
    on_value:
      then:
        - lambda: |-
            if (id(meter_frame_active) &&
                uint32_t(millis() - id(meter_frame_started_ms)) < 3000UL &&
                std::isfinite(x)) {
