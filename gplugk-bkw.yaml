    state_class: measurement
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (isnan(id(net_power).state) || isnan(id(net_power_from_phases).state)) return NAN;
      return id(net_power).state - id(net_power_from_phases).state;
    web_server:
