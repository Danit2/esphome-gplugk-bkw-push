      if (isnan(id(current_l1).state) || isnan(id(current_l2).state) || isnan(id(current_l3).state)) return NAN;
      return std::max(id(current_l1).state, std::max(id(current_l2).state, id(current_l3).state));
    web_server:
      sorting_group_id: group_calculated
      
  - platform: template
    name: "Hauptsicherung"
    id: main_fuse_sensor
    icon: "mdi:fuse"
    unit_of_measurement: "A"
    device_class: current
