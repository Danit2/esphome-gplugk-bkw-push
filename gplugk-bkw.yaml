    name: "Abdeckung 15-Minuten-Mittel"
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: group_diagnostics

  # --- ESP32 / WLAN Diagnose ---------------------------------------------
  - platform: wifi_signal
    id: wifi_signal_db
    name: "WLAN Signal"
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics

  - platform: copy
    source_id: wifi_signal_db
    name: "WLAN Signal Prozent"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    entity_category: diagnostic
    device_class: ""
    filters:
      - lambda: return std::min(std::max(2.0f * (x + 100.0f), 0.0f), 100.0f);
    web_server:
      sorting_group_id: group_diagnostics

  - platform: internal_temperature
    name: "Chiptemperatur"
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics

  - platform: uptime
    name: "Laufzeit"
    type: seconds
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics

# Nicht-numerische Werte und Systeminformationen.
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-Adresse"
      entity_category: diagnostic
      web_server:
        sorting_group_id: group_diagnostics
    ssid:
      name: "Verbundenes WLAN"
      entity_category: diagnostic
      web_server:
        sorting_group_id: group_diagnostics
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    hide_hash: true
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics

  - platform: debug
    reset_reason:
      name: "Letzter Neustartgrund"
      entity_category: diagnostic
      web_server:
        sorting_group_id: group_diagnostics

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "1.1.0.2.129.255"
    name: "OBIS Listenkennung"
    entity_category: diagnostic
    # Dieses Feld steht am Anfang jedes BKW-PUSH-Telegramms.
    # Es verhindert, dass Messwerte aus verschiedenen Telegrammen
    # für eine Berechnung zusammengemischt werden.
    on_value:
      then:
        - lambda: |-
            if (id(meter_frame_active)) {
              ESP_LOGW("bkw_calc", "Vorheriges Telegramm unvollstaendig: Maske 0x%04lX",
                       (unsigned long) id(meter_seen_mask));
            }
            id(meter_seen_mask) = 0UL;
            id(meter_frame_started_ms) = millis();
            id(meter_frame_active) = true;
    web_server:
      sorting_group_id: group_info

  - platform: dlms_meter
    dlms_meter_id: bkw_meter
    obis_code: "0.1.1.0.0.255"
    name: "Zähleruhr"
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_info

  - platform: template
    name: "Höchstbelastete Phase"
    id: busiest_phase
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: group_calculated

  - platform: template
    name: "Datenstatus"
    id: data_status
    entity_category: diagnostic
    # Nur Zustandsaenderungen publizieren, nicht alle 5 Sekunden "OK".
    # Ein 1-s-Check erkennt auch den Empfangsausfall zeitnah.
    update_interval: 1s
    lambda: |-
      std::string next_status;
      if (id(last_data_ms) == 0) {
        next_status = "Warte auf Zählerdaten";
      } else if (uint32_t(millis() - id(last_data_ms)) >= ${stale_after_ms}) {
        next_status = "Daten veraltet";
      } else {
        next_status = "OK";
      }
      // ESPHome: return {} unterdrueckt die Veroeffentlichung.
      // Bei HA-Neuverbindung liefert die API den zuletzt publizierten Zustand.
      static std::string last_status;
      if (next_status == last_status) return {};
      last_status = next_status;
      return {next_status};
    web_server:
      sorting_group_id: group_diagnostics

  - platform: template
    name: "Sicherungsgrenze Phasenstrom"
    id: fuse_threshold_status
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: group_diagnostics

  - platform: template
    name: "Status gleichzeitiger Bezug und Rücklieferung"
    id: simultaneous_directions_status
    entity_category: diagnostic
    update_interval: never
    web_server:
      sorting_group_id: group_diagnostics

binary_sensor:
  - platform: status
    name: "ESPHome Verbindung"
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_diagnostics

  # Physischer AP-Taster auf GPIO9 mit internem Pull-up. GPIO9 ist beim
  # ESP32-C3 zugleich ein Boot-Strap-Pin.
  - platform: gpio
    id: ap_mode_button
    pin:
      number: ${ap_button_pin}
      mode:
        input: true
        pullup: true
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      then:
        - script.execute: enable_setup_ap

  - platform: template
    name: "Zählerdaten aktuell"
    id: data_fresh
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(last_data_ms) != 0 && uint32_t(millis() - id(last_data_ms)) < ${stale_after_ms};
    on_release:
      then:
        # Diese Werte werden sonst nur bei einem neuen Telegramm publiziert.
        # Beim Veralten einmal gezielt auf unbekannt/0 setzen, statt jede
        # Sekunde unveränderte Diagnosewerte über WLAN zu senden.
        - lambda: |-
            id(meter_frame_active) = false;
            id(meter_seen_mask) = 0UL;
            id(mean_import_15min).publish_state(NAN);
            id(mean_export_15min).publish_state(NAN);
            id(window_coverage_sensor).publish_state(0.0f);

            // Keine alten, scheinbar aktuellen Ableitungen bei Datenausfall.
            id(net_power).publish_state(NAN);
            id(net_import_power).publish_state(NAN);
            id(net_export_power).publish_state(NAN);
            id(net_power_l1).publish_state(NAN);
            id(net_power_l2).publish_state(NAN);
            id(net_power_l3).publish_state(NAN);
            id(current_max).publish_state(NAN);
            id(fuse_utilization).publish_state(NAN);
            id(current_headroom).publish_state(NAN);
            id(net_power_from_phases).publish_state(NAN);
            id(balancing_difference).publish_state(NAN);
            id(simultaneous_import_export).publish_state(NAN);
            id(current_sum).publish_state(NAN);
            id(current_spread).publish_state(NAN);
            id(apparent_power_sum).publish_state(NAN);
            id(busiest_phase).publish_state("unbekannt");
            id(fuse_threshold_status).publish_state("Keine aktuellen Daten");
            id(simultaneous_directions_status).publish_state("Keine aktuellen Daten");
    web_server:
      sorting_group_id: group_diagnostics


# Software-Gegenstück zum physischen Reset-Taster. Der Hardware-Reset wirkt
# direkt auf den ESP32-C3 und benötigt deshalb keinen ESPHome-GPIO-Eintrag.
button:
  - platform: restart
    name: "Software Neustart"
    entity_category: config
    web_server:
      sorting_group_id: group_diagnostics
