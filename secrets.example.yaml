# Diese Datei als secrets.yaml kopieren und alle Werte ersetzen.

wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# Mindestens 8 Zeichen fuer den Setup Access Point.
fallback_password: "CHANGE_ME_FALLBACK"

# ESPHome API-Verschluesselungsschluessel (32 Byte, Base64).
api_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="

# Zugang fuer die lokale ESPHome-Weboberflaeche.
web_username: "admin"
web_password: "CHANGE_ME_WEB"

# BKW/Kamstrup GPK60: exakt 32 Hex-Zeichen.
bkw_gpk60: "00112233445566778899AABBCCDDEEFF"

# Nur falls BKW zusaetzlich einen GPK61/Auth-Key bereitstellt:
# bkw_gpk61: "FFEEDDCCBBAA99887766554433221100"
